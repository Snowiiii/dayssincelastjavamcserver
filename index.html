<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Minecraft Server Explorer</title>
    <link rel="icon" type="image/x-icon" href="./images/pumpkin-logo.svg">

    <meta
      name="description"
      content="Browse, filter and compare Minecraft server and proxy forks: author, version, language, price, what it's based on, and its full fork tree."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css" />
    <script src="https://d3js.org/d3.v7.min.js"></script>
  </head>
  <body>
    <header class="site-header">
      <div class="inner">
        <div class="brand">
          <img src="./images/pumpkin-logo.svg" alt="Pumpkin logo" class="header-logo" />
          <div>
            <h1><span class="hl">Minecraft</span> server explorer</h1>
            <p>Servers &amp; proxies: forks and from-scratch projects</p>
          </div>
        </div>
        <div class="header-stats">
          <div class="stat">
            <div class="num" id="stat-total">0</div>
            <div class="label">Projects</div>
          </div>
          <div class="stat">
            <div class="num" id="stat-forks">0</div>
            <div class="label">Forks</div>
          </div>
        </div>
      </div>
    </header>

    <main class="page">
      <div class="content">
        <!-- Filters -->
        <aside class="filters" aria-label="Search filters">
          <div class="filters-head">
            <h2>Filters</h2>
            <button type="button" class="reset-btn" id="reset-btn">Clear</button>
          </div>

          <form id="filter-form">
            <div class="field">
              <label for="f-name">Search by name</label>
              <div class="select-wrap select-wrap-auto">
                <input type="text" id="f-name" placeholder="e.g. Paper, Spigot…" autocomplete="off" />
                <datalist id="name-list"></datalist>
              </div>
            </div>

            <div class="field">
              <label for="f-author">Author</label>
              <div class="select-wrap select-wrap-auto">
                <input type="text" id="f-author" list="author-list" placeholder="Any" autocomplete="off" />
                <datalist id="author-list"></datalist>
              </div>
            </div>

            <div class="field">
              <label for="f-version">Version</label>
              <div class="select-wrap">
                <select id="f-version">
                  <option value="">All</option>
                </select>
              </div>
            </div>

            <div class="field">
              <label for="f-language">Language</label>
              <div class="select-wrap">
                <select id="f-language">
                  <option value="">All</option>
                </select>
              </div>
            </div>

            <div class="field">
              <label for="f-origin">Project type</label>
              <div class="select-wrap">
                <select id="f-origin">
                  <option value="">Fork &amp; from scratch</option>
                  <option value="fork">Fork (based on another)</option>
                  <option value="scratch">From scratch</option>
                </select>
              </div>
            </div>

            <div class="field">
              <label for="f-category">Category</label>
              <div class="select-wrap">
                <select id="f-category">
                  <option value="">Server &amp; Proxy</option>
                  <option value="server">Server</option>
                  <option value="proxy">Proxy</option>
                </select>
              </div>
            </div>

            <div class="field">
              <label for="f-status">Status</label>
              <div class="select-wrap">
                <select id="f-status">
                  <option value="">All</option>
                  <option value="maintained">Maintained</option>
                  <option value="rarely-updated">Rarely updated</option>
                  <option value="migrated">Migrated</option>
                  <option value="deprecated">Deprecated</option>
                  <option value="abandoned">Abandoned</option>
                </select>
              </div>
            </div>

            <div class="field">
              <label for="f-price">Price</label>
              <div class="select-wrap">
                <select id="f-price">
                  <option value="">Any</option>
                  <option value="free">Free</option>
                  <option value="paid">Paid</option>
                </select>
              </div>
            </div>

            <div class="field">
              <label>Date range</label>

              <strong>From</strong>
              <div>
                <input type="date" id="f-date-min" aria-label="From date" />
              </div>

              <strong>To</strong>
              <div>
                <input type="date" id="f-date-max" aria-label="To date" />
              </div>

            </div>

          </form>
        </aside>

        <!-- Results -->
        <section aria-label="Results">
          <div class="results-head">
            <div class="count"><b id="result-count">0</b> results</div>
            <div class="sort-field">
              <label for="f-sort">Sort</label>
              <div class="select-wrap">
                <select id="f-sort">
                  <option value="name-asc">Name (A–Z)</option>
                  <option value="name-desc">Name (Z–A)</option>
                  <option value="date-desc">Date (newest)</option>
                  <option value="date-asc">Date (oldest)</option>
                  <option value="price-asc">Price (lowest)</option>
                  <option value="price-desc">Price (highest)</option>
                </select>
              </div>
            </div>
          </div>

          <div class="cards" id="cards"></div>
          <nav class="pagination" id="pagination" aria-label="Pagination"></nav>
        </section>
      </div>
    </main>

    <footer class="site-footer">
      <div class="footer-inner">
        <div class="footer-brand">
          <img src="./images/pumpkin-logo.svg" alt="Pumpkin logo" class="footer-logo" />
          <span class="footer-name">Pumpkin</span>
        </div>
        <nav class="footer-nav" aria-label="Footer links">
          <a href="https://docs.pumpkinmc.org/" target="_blank" rel="noopener noreferrer">Documentation</a>
          <a href="https://github.com/Snowiiii/dayssincelastjavamcserver" target="_blank" rel="noopener noreferrer">GitHub</a>
          <a href="https://discord.com/invite/wT8XjrjKkf" target="_blank" rel="noopener noreferrer">Discord</a>
          <a href="https://x.com/pumpkinmcdev" target="_blank" rel="noopener noreferrer">X</a>
          <a href="https://www.youtube.com/@PumpkinServer" target="_blank" rel="noopener noreferrer">YouTube</a>
          <a href="https://github.com/sponsors/Snowiiii" target="_blank" rel="noopener noreferrer">Donate</a>
        </nav>
      </div>
    </footer>

    <!-- Fork tree modal -->
    <div class="modal-overlay" id="tree-modal" role="dialog" aria-modal="true" aria-labelledby="tree-title">
      <div class="modal">
        <div class="modal-head">
          <div>
            <h3 id="tree-title">Fork tree</h3>
            <p id="tree-subtitle"></p>
          </div>
          <button class="close-btn" id="tree-close" aria-label="Close">×</button>
        </div>
        <div id="tree-container"></div>
        <div class="tree-controls">
          <button id="zoom-in" title="Zoom in">+</button>
          <button id="zoom-out" title="Zoom out">−</button>
          <button id="zoom-reset" title="Reset view">⟲</button>
        </div>
      </div>
    </div>

    <script type="module" src="./js/main.js"></script>
  </body>
</html>
